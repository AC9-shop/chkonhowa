function cardsPerPlayer(n){ if(n===2) return 10; if(n<=4) return 8; if(n<=6) return 7; return 6; }
function findCard(id){ return CARDS.find(c=>c.id===id); }
function genCode(){ const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }
function genId(){ return (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)); }
function initials(name){ return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let S = {
  screen: 'home', myName:'', myId: genId(), code:null, room:null, unsub:null,
  error:null, difficultyChoice:'all', joinCodeInput:'', searchText:'',
  selectedCharId:null, describingTimerSeconds:30, describingTimerHandle:null,
  rulesOpen:false, lastEliminatedShown:false,
};

function poolForDifficulty(diff){
  if(diff==='all') return CARDS;
  return CARDS.filter(c=>c.diff===diff);
}

// ---------------- FIREBASE ACTIONS ----------------
async function createRoom(){
  if(CONFIG_IS_PLACEHOLDER){ S.error="Khassek dir Firebase config awalan (chouf commentaire f top dyal l-code)."; render(); return; }
  if(!S.myName.trim()){ S.error="Kteb smiytek."; render(); return; }
  const code = genCode();
  const roomRef = doc(db,'rooms',code);
  const initialRoom = {
    hostId: S.myId, difficulty: S.difficultyChoice, phase:'lobby',
    players:[{id:S.myId,name:S.myName.trim(),lives:0,eliminated:false}],
    describerIndex:0, round:0, usedCharacterIds:[], targetCharacterId:null, guesses:[],
    winnerId:null, createdAt: Date.now(),
  };
  await setDoc(roomRef, initialRoom);
  S.code = code;
  subscribeRoom(code);
  S.screen='lobby'; S.error=null; render();
}

async function joinRoom(){
  if(CONFIG_IS_PLACEHOLDER){ S.error="Khassek dir Firebase config awalan."; render(); return; }
  const code = S.joinCodeInput.trim().toUpperCase();
  if(!code || !S.myName.trim()){ S.error="Kteb smiytek w code dyal ghorfa."; render(); return; }
  const roomRef = doc(db,'rooms',code);
  try{
    await runTransaction(db, async (tx)=>{
      const snap = await tx.get(roomRef);
      if(!snap.exists()) throw new Error("Had l-ghorfa mabghach mawjouda.");
      const data = snap.data();
      if(data.phase!=='lobby') throw new Error("L3ab bda mn 9bel, ma tqdrch dkhol daba.");
      if(data.players.length>=8) throw new Error("Ghorfa 3amra (8 max).");
      if(data.players.some(p=>p.id===S.myId)) return;
      const players=[...data.players,{id:S.myId,name:S.myName.trim(),lives:0,eliminated:false}];
      tx.update(roomRef,{players});
    });
    S.code = code;
    subscribeRoom(code);
    S.screen='lobby'; S.error=null; render();
  }catch(e){
    S.error = e.message || "Chi mochkil f connexion.";
    render();
  }
}

function subscribeRoom(code){
  if(S.unsub) S.unsub();
  const roomRef = doc(db,'rooms',code);
  S.unsub = onSnapshot(roomRef,(snap)=>{
    if(!snap.exists()){ S.room=null; return; }
    S.room = snap.data();
    checkMyElimination();
    render();
  });
}

async function startGame(){
  const roomRef = doc(db,'rooms',S.code);
  await runTransaction(db, async (tx)=>{
    const snap = await tx.get(roomRef);
    const data = snap.data();
    if(data.players.length<2) return;
    const lives = cardsPerPlayer(data.players.length);
    const players = data.players.map(p=>({...p,lives,eliminated:false}));
    tx.update(roomRef,{players,phase:'picking',describerIndex:0,round:1,usedCharacterIds:[],targetCharacterId:null,guesses:[],winnerId:null});
  });
}

async function pickTarget(characterId){
  const roomRef = doc(db,'rooms',S.code);
  await runTransaction(db, async (tx)=>{
    const snap = await tx.get(roomRef);
    const data = snap.data();
    tx.update(roomRef,{targetCharacterId:characterId, usedCharacterIds:[...data.usedCharacterIds,characterId], phase:'describing'});
  });
}

function startDescribingTimer(){
  if(S.describingTimerHandle) return;
  S.describingTimerSeconds=30;
  S.describingTimerHandle = setInterval(()=>{
    S.describingTimerSeconds--;
    const el=document.getElementById('timerDisplay');
    if(el) el.textContent = Math.max(S.describingTimerSeconds,0);
    if(S.describingTimerSeconds<=0){ clearInterval(S.describingTimerHandle); S.describingTimerHandle=null; }
  },1000);
}

async function finishDescribing(){
  if(S.describingTimerHandle){ clearInterval(S.describingTimerHandle); S.describingTimerHandle=null; }
  const roomRef = doc(db,'rooms',S.code);
  await runTransaction(db, async (tx)=>{
    tx.update(roomRef,{phase:'guessing', guesses:[]});
  });
}

async function submitGuess(characterId){
  const roomRef = doc(db,'rooms',S.code);
  await runTransaction(db, async (tx)=>{
    const snap = await tx.get(roomRef);
    const data = snap.data();
    if(data.guesses.some(g=>g.playerId===S.myId)) return;
    const guesses=[...data.guesses,{playerId:S.myId, characterId, ts:Date.now()}];
    tx.update(roomRef,{guesses});
  });
  S.selectedCharId=null;
}

async function lockGuessing(){
  const roomRef = doc(db,'rooms',S.code);
  await runTransaction(db, async (tx)=>{ tx.update(roomRef,{phase:'reveal'}); });
}

async function applyReveal(){
  const roomRef = doc(db,'rooms',S.code);
  await runTransaction(db, async (tx)=>{
    const snap = await tx.get(roomRef);
    const data = snap.data();
    const players = data.players.map(p=>({...p}));
    const describer = players[data.describerIndex];
    const sorted = [...data.guesses].sort((a,b)=>a.ts-b.ts);
    let claimed=false;
    sorted.forEach(g=>{
      const guesser = players.find(p=>p.id===g.playerId);
      if(!guesser) return;
      if(g.characterId===data.targetCharacterId && !claimed){
        guesser.lives+=1; describer.lives-=1; claimed=true;
      } else if(g.characterId!==data.targetCharacterId){
        guesser.lives-=1; describer.lives+=1;
      }
    });
    players.forEach(p=>{ if(p.lives<=0) p.eliminated=true; });
    const remaining = players.filter(p=>!p.eliminated);
    let update;
    if(remaining.length<=1){
      update = {players, phase:'winner', winnerId: remaining[0]? remaining[0].id : null};
    } else {
      let nextIdx = data.describerIndex;
      for(let step=1; step<=players.length; step++){
        const idx=(data.describerIndex+step)%players.length;
        if(!players[idx].eliminated){ nextIdx=idx; break; }
      }
      let usedIds = data.usedCharacterIds;
      const pool = poolForDifficulty(data.difficulty);
      if(usedIds.length >= pool.length) usedIds=[];
      update = {players, phase:'picking', describerIndex:nextIdx, round:data.round+1, targetCharacterId:null, guesses:[], usedCharacterIds:usedIds};
    }
    tx.update(roomRef, update);
  });
}

function checkMyElimination(){
  if(!S.room) return;
  const me = S.room.players.find(p=>p.id===S.myId);
  if(me && me.eliminated && !S.lastEliminatedShown){
    S.lastEliminatedShown=true;
    S.showElimModal=true;
    S.elimQuestion = EMBARRASSING_QUESTIONS[Math.floor(Math.random()*EMBARRASSING_QUESTIONS.length)];
  }
  if(me && !me.eliminated){ S.lastEliminatedShown=false; }
}

function leaveToHome(){
  if(S.unsub) S.unsub();
  S = {...S, screen:'home', room:null, code:null, error:null, lastEliminatedShown:false, showElimModal:false};
  render();
}

// ---------------- RENDER ----------------
function render(){
  const app = document.getElementById('app');
  app.innerHTML='';
  const rulesBtn=document.createElement('button');
  rulesBtn.className='rules-btn'; rulesBtn.textContent='9wanin';
  rulesBtn.onclick=()=>{ S.rulesOpen=true; render(); };
  app.appendChild(rulesBtn);

  const wrap=document.createElement('div');
  wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.flex='1'; wrap.style.marginTop='26px';

  if(S.screen==='home') wrap.appendChild(renderHome());
  else if(!S.room) wrap.appendChild(renderLoading());
  else if(S.room.phase==='lobby') wrap.appendChild(renderLobby());
  else if(S.room.phase==='picking') wrap.appendChild(renderPicking());
  else if(S.room.phase==='describing') wrap.appendChild(renderDescribing());
  else if(S.room.phase==='guessing') wrap.appendChild(renderGuessing());
  else if(S.room.phase==='reveal') wrap.appendChild(renderReveal());
  else if(S.room.phase==='winner') wrap.appendChild(renderWinnerScreen());

  app.appendChild(wrap);
  if(S.rulesOpen) app.appendChild(renderRulesModal());
  if(S.showElimModal) app.appendChild(renderElimModal());
}

function characterPicker(pool, onConfirm, excludeUsed){
  const box=document.createElement('div');
  const search=document.createElement('input');
  search.className='text-input search-input';
  search.placeholder='9lb 3la smiya...';
  search.value=S.searchText;
  search.oninput=(e)=>{ S.searchText=e.target.value; renderGridInto(); };
  box.appendChild(search);
  const grid=document.createElement('div');
  grid.className='card-grid';
  box.appendChild(grid);
  function renderGridInto(){
    grid.innerHTML='';
    const usedSet = new Set(S.room.usedCharacterIds||[]);
    pool.filter(c=>c.name.toLowerCase().includes(S.searchText.toLowerCase()))
      .forEach(c=>{
        const isUsed = excludeUsed && usedSet.has(c.id);
        const el=document.createElement('div');
        el.className='pcard'+(isUsed?' used':'')+(S.selectedCharId===c.id?' selected':'');
        el.innerHTML = `<div class="tag-row"><span class="cat-tag cat-${c.cat}">${CAT_LABEL[c.cat]}</span><span class="diff-tag diff-${c.diff}">${DIFF_LABEL[c.diff]}</span></div><span class="cname">${escapeHtml(c.name)}</span>`;
        if(!isUsed){
          el.onclick=()=>{ S.selectedCharId=c.id; confirmBtn.disabled=false; renderGridInto(); };
        }
        grid.appendChild(el);
      });
  }
  renderGridInto();
  const spacer=document.createElement('div'); spacer.className='grow'; box.appendChild(spacer);
  const confirmBtn=document.createElement('button');
  confirmBtn.className='btn btn-primary';
  confirmBtn.textContent='Confirmi';
  confirmBtn.disabled = S.selectedCharId===null;
  confirmBtn.onclick=()=>{ if(S.selectedCharId!==null) onConfirm(S.selectedCharId); };
  box.appendChild(confirmBtn);
  return box;
}

function renderHome(){
  const d=document.createElement('div');
  d.innerHTML=`<h1 class="brand">Chkoun <span>Howa؟</span></h1><p class="tagline">Online — kola wa7d b téléphone dyalo.</p>`;
  if(CONFIG_IS_PLACEHOLDER){
    const warn=document.createElement('div');
    warn.className='config-warning';
    warn.innerHTML = `⚠️ Firebase mazal ma tconfigurach. 7el l-code dyal had l-page, 9elleb 3la <code>firebaseConfig</code> f top, w 3awad l-config dyal Firebase project dyalek (Firestore f test mode).`;
    d.appendChild(warn);
  }
  if(S.error){ const e=document.createElement('div'); e.className='error-box'; e.textContent=S.error; d.appendChild(e); }
  const nameInput=document.createElement('input');
  nameInput.className='text-input'; nameInput.placeholder='Smiytek';
  nameInput.value=S.myName; nameInput.style.marginBottom='14px';
  nameInput.oninput=(e)=>{ S.myName=e.target.value; };
  d.appendChild(nameInput);

  const createBtn=document.createElement('button');
  createBtn.className='btn btn-primary'; createBtn.style.marginBottom='10px';
  createBtn.textContent='Sawb ghorfa jdida 🏠';
  createBtn.onclick=()=>{ if(!S.myName.trim()){ S.error='Kteb smiytek awalan.'; render(); return;} S.screen='create-setup'; S.error=null; render(); };
  d.appendChild(createBtn);

  const spacer=document.createElement('div'); spacer.style.height='8px'; d.appendChild(spacer);
  const codeInput=document.createElement('input');
  codeInput.className='text-input'; codeInput.placeholder='Code dyal ghorfa (5 hrouf)';
  codeInput.style.marginBottom='10px'; codeInput.style.textTransform='uppercase';
  codeInput.value=S.joinCodeInput;
  codeInput.oninput=(e)=>{ S.joinCodeInput=e.target.value; };
  d.appendChild(codeInput);
  const joinBtn=document.createElement('button');
  joinBtn.className='btn btn-secondary';
  joinBtn.textContent='Dkhol l ghorfa 🚪';
  joinBtn.onclick=joinRoom;
  d.appendChild(joinBtn);
  return d;
}

function renderLoading(){
  const d=document.createElement('div');
  d.className='pass-screen';
  d.innerHTML=`<p class="hint">Kayet7ml l-ghorfa...</p>`;
  return d;
}

function renderLobby(){
  const room=S.room;
  const d=document.createElement('div');
  d.innerHTML=`<h2 class="screen-title">Ghorfa dyal l3ab</h2><p class="hint">Partaji had code m3a l-shab (WhatsApp, Instagram...):</p>`;
  const codeDiv=document.createElement('div'); codeDiv.className='code-display'; codeDiv.textContent=S.code;
  d.appendChild(codeDiv);
  const diffNote=document.createElement('p'); diffNote.className='hint';
  diffNote.textContent = `So3oba: ${room.difficulty==='all'?'Kolchi mkhalt':DIFF_LABEL[room.difficulty]} — ${room.players.length} player(s) dakhlin`;
  d.appendChild(diffNote);
  room.players.forEach(p=>{
    const row=document.createElement('div');
    row.className='player-row'+(p.id===S.myId?' me':'');
    row.innerHTML=`<span>${escapeHtml(p.name)}${p.id===room.hostId?' 👑':''}</span>`;
    d.appendChild(row);
  });
  const spacer=document.createElement('div'); spacer.className='grow'; d.appendChild(spacer);
  if(room.hostId===S.myId){
    const startBtn=document.createElement('button');
    startBtn.className='btn btn-primary';
    startBtn.textContent='Bda l3ab 🎲';
    startBtn.disabled = room.players.length<2;
    startBtn.onclick=startGame;
    d.appendChild(startBtn);
    if(room.players.length<2){
      const note=document.createElement('p'); note.className='hint'; note.style.textAlign='center'; note.style.marginTop='8px';
      note.textContent='Khassek 3la l-9al 2 players bach tbda.';
      d.appendChild(note);
    }
  } else {
    const note=document.createElement('p'); note.className='hint'; note.style.textAlign='center';
    note.textContent='Katsna host bach ybda l3ab...';
    d.appendChild(note);
  }
  return d;
}

function renderPicking(){
  const room=S.room;
  const describer=room.players[room.describerIndex];
  const d=document.createElement('div');
  if(describer.id===S.myId){
    d.innerHTML=`<h2 class="screen-title">Khtar chakhsiya bach twsefha</h2><p class="hint">L-baqi ma yshoufouch had l-choix dyalek.</p>`;
    d.appendChild(characterPicker(poolForDifficulty(room.difficulty), (id)=>{ S.selectedCharId=null; S.searchText=''; pickTarget(id); }, true));
  } else {
    d.className+=''; d.appendChild(renderWaitScreen(`${describer.name} rah kaykhtar chakhsiya...`,'⏳'));
  }
  return d;
}

function renderWaitScreen(msg, emoji){
  const d=document.createElement('div');
  d.className='pass-screen';
  d.innerHTML=`<div class="pass-avatar" style="font-size:30px;">${emoji}</div><p class="hint" style="text-align:center;font-size:15px;">${escapeHtml(msg)}</p>`;
  appendScoreboard(d);
  return d;
}

function appendScoreboard(container){
  const room=S.room;
  const box=document.createElement('div'); box.style.width='100%'; box.style.marginTop='14px';
  room.players.forEach((p,idx)=>{
    const row=document.createElement('div');
    row.className='player-row'+(p.eliminated?' eliminated':'')+(p.id===S.myId?' me':'');
    row.innerHTML=`<span>${escapeHtml(p.name)}${idx===room.describerIndex?'<span class="desc-tag">🎙️ Describer</span>':''}</span><span class="lives">${p.lives} ❤️</span>`;
    box.appendChild(row);
  });
  container.appendChild(box);
}

function renderDescribing(){
  const room=S.room;
  const describer=room.players[room.describerIndex];
  const d=document.createElement('div');
  if(describer.id===S.myId){
    d.innerHTML=`<h2 class="screen-title">Daba wsef biha! 🎙️</h2>
      <p class="hint">B sotek, wsef l-chakhsiya bla ma tsemmiha b l-esm.</p>
      <div class="timer" id="timerDisplay">30</div>`;
    const startBtn=document.createElement('button');
    startBtn.className='btn btn-secondary'; startBtn.textContent='Bda l-compteur ⏱️';
    startBtn.onclick=()=>{ startDescribingTimer(); startBtn.disabled=true; };
    d.appendChild(startBtn);
    const spacer=document.createElement('div'); spacer.className='grow'; d.appendChild(spacer);
    const doneBtn=document.createElement('button');
    doneBtn.className='btn btn-primary'; doneBtn.style.marginTop='14px';
    doneBtn.textContent='Khlast, bda l-khamin ➜';
    doneBtn.onclick=finishDescribing;
    d.appendChild(doneBtn);
  } else {
    d.appendChild(renderWaitScreen(`${describer.name} kaywsef daba — sm3o mzyan!`,'🎙️'));
  }
  return d;
}

function renderGuessing(){
  const room=S.room;
  const describer=room.players[room.describerIndex];
  const me = room.players.find(p=>p.id===S.myId);
  const alreadyGuessed = room.guesses.some(g=>g.playerId===S.myId);
  const d=document.createElement('div');
  if(describer.id===S.myId){
    d.innerHTML=`<h2 class="screen-title">L-khamin f-9asa 🤔</h2><p class="hint">${room.guesses.length} khamnou 7ta daba. Sedd mnin bghiti.</p>`;
    const list=document.createElement('div');
    room.players.forEach(p=>{
      if(p.id===describer.id) return;
      const guessed = room.guesses.some(g=>g.playerId===p.id);
      const row=document.createElement('div'); row.className='player-row'+(p.eliminated?' eliminated':'');
      row.innerHTML=`<span>${escapeHtml(p.name)}</span><span>${p.eliminated?'khsar':(guessed?'✅ khamnu':'⏳ mazal')}</span>`;
      list.appendChild(row);
    });
    d.appendChild(list);
    const spacer=document.createElement('div'); spacer.className='grow'; d.appendChild(spacer);
    const lockBtn=document.createElement('button');
    lockBtn.className='btn btn-primary'; lockBtn.textContent='Sedd l-khamin, chouf natija ➜';
    lockBtn.onclick=lockGuessing;
    d.appendChild(lockBtn);
  } else if(me.eliminated){
    d.appendChild(renderWaitScreen('Nta khsarti f had l-jawla, tsna l-jawla li jaya...','😅'));
  } else if(alreadyGuessed){
    d.appendChild(renderWaitScreen('Sift l-guess dyalek! Tsna l-baqi...','✅'));
  } else {
    d.innerHTML=`<h2 class="screen-title">Chkoun taybane lik hiya?</h2><p class="hint">Khtar l-chakhsiya li twesfat.</p>`;
    d.appendChild(characterPicker(poolForDifficulty(room.difficulty), (id)=>{ S.selectedCharId=null; S.searchText=''; submitGuess(id); }, false));
  }
  return d;
}

function renderReveal(){
  const room=S.room;
  const describer=room.players[room.describerIndex];
  const targetCard=findCard(room.targetCharacterId);
  const d=document.createElement('div');
  d.innerHTML=`<h2 class="screen-title">L-Kachf! 🎭</h2>`;
  const tDiv=document.createElement('div'); tDiv.className='target-card';
  tDiv.innerHTML=`<div class="lbl">L-chakhsiya li twesfat mn ${escapeHtml(describer.name)}</div><div class="name">${escapeHtml(targetCard.name)}</div>`;
  d.appendChild(tDiv);
  const sorted=[...room.guesses].sort((a,b)=>a.ts-b.ts);
  let claimed=false;
  sorted.forEach(g=>{
    const guesser=room.players.find(p=>p.id===g.playerId);
    const c=findCard(g.characterId);
    let badge,cls;
    if(g.characterId===room.targetCharacterId && !claimed){ badge='Sa77 ✅'; cls='match'; claimed=true; }
    else if(g.characterId===room.targetCharacterId && claimed){ badge='Mte5er ⏱️'; cls='late'; }
    else { badge='Ghalat ❌'; cls='nomatch'; }
    const row=document.createElement('div'); row.className='reveal-row';
    row.innerHTML=`<div><div class="who">${escapeHtml(guesser.name)} khtar</div><div class="what">${escapeHtml(c.name)}</div></div><span class="badge ${cls}">${badge}</span>`;
    d.appendChild(row);
  });
  if(sorted.length===0){
    const row=document.createElement('div'); row.className='reveal-row';
    row.innerHTML=`<div class="who">Hta wa7d ma guess.</div>`;
    d.appendChild(row);
  }
  const spacer=document.createElement('div'); spacer.className='grow'; d.appendChild(spacer);
  if(describer.id===S.myId){
    const btn=document.createElement('button'); btn.className='btn btn-primary'; btn.textContent='Zid l-dawr li jay ➜';
    btn.onclick=applyReveal;
    d.appendChild(btn);
  } else {
    const note=document.createElement('p'); note.className='hint'; note.style.textAlign='center';
    note.textContent='Katsna Describer bach ykml l-jawla...';
    d.appendChild(note);
  }
  return d;
}

function renderWinnerScreen(){
  const room=S.room;
  const winner=room.players.find(p=>p.id===room.winnerId);
  const d=document.createElement('div');
  d.className='pass-screen';
  d.innerHTML=`<div class="winner-emoji">🏆</div><div class="pass-name">${escapeHtml(winner?winner.name:'?')}</div><div class="pass-role">Howa l-Fa2iz!</div>`;
  const btn=document.createElement('button'); btn.className='btn btn-primary'; btn.textContent='Rje3 l-daya 🏠';
  btn.onclick=leaveToHome;
  d.appendChild(btn);
  return d;
}

function renderRulesModal(){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.onclick=(e)=>{ if(e.target===bg){ S.rulesOpen=false; render(); } };
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<h3>Kifach kaymchi l3ab</h3><p style="text-align:right;font-size:13.5px;">
    1. Kola l3ab 3ando access l nafs la liste dyal chakhsiyat (7sab so3oba li tkhtart).<br>
    2. Describer kaykhtar wa7da w kaywsefha b sotu, bla ma ysemmiha.<br>
    3. Ay wa7d bgha ykhamen, kaykhtar mn nafss la liste — f nafss lwe9t, hta wa7d ma kaystena.<br>
    4. Sa77: guesser +1 ❤️, Describer -1 ❤️. Ghalat: guesser -1 ❤️, Describer +1 ❤️.<br>
    5. Wsselti l 0 ❤️ → khsarti, kaytar7 lik soual mo7rij.<br>
    6. Akhir wa7d bqa 3ando ❤️, howa l-fa2iz!</p>`;
  const btn=document.createElement('button'); btn.className='btn btn-secondary'; btn.textContent='Fhemt 👍';
  btn.onclick=()=>{ S.rulesOpen=false; render(); };
  m.appendChild(btn); bg.appendChild(m); return bg;
}

function renderElimModal(){
  const bg=document.createElement('div'); bg.className='modal-bg';
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<h3>Khsarti! 😅</h3><p>${escapeHtml(S.elimQuestion)}</p>`;
  const btn=document.createElement('button'); btn.className='btn btn-primary'; btn.textContent='Fhemt, kmml l3ab';
  btn.onclick=()=>{ S.showElimModal=false; render(); };
  m.appendChild(btn); bg.appendChild(m); return bg;
}

// create-setup screen injected into render switch via S.screen check
const originalRender = render;
render = function(){
  if(S.screen==='create-setup' && !S.room){
    const app=document.getElementById('app');
    app.innerHTML='';
    const wrap=document.createElement('div');
    wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.flex='1'; wrap.style.marginTop='10px';
    wrap.innerHTML=`<h2 class="screen-title">Chkoun So3oba bghiti?</h2><p class="hint">Had l-so3oba ghatkoun nafsha l kola player.</p>`;
    const chips=document.createElement('div'); chips.className='chip-list';
    [['all','Kolchi mkhalt'],['easy','Sahla'],['medium','Motawasta'],['hard','Sa3ba']].forEach(([val,label])=>{
      const chip=document.createElement('div');
      chip.className='chip'+(S.difficultyChoice===val?' on':'');
      chip.textContent=label;
      chip.onclick=()=>{ S.difficultyChoice=val; render(); };
      chips.appendChild(chip);
    });
    wrap.appendChild(chips);
    if(S.error){ const e=document.createElement('div'); e.className='error-box'; e.textContent=S.error; wrap.appendChild(e); }
    const spacer=document.createElement('div'); spacer.className='grow'; wrap.appendChild(spacer);
    const btn=document.createElement('button'); btn.className='btn btn-primary'; btn.textContent='Sawb Ghorfa 🏠';
    btn.onclick=createRoom;
    wrap.appendChild(btn);
    app.appendChild(wrap);
    return;
  }
  originalRender();
};

render();
